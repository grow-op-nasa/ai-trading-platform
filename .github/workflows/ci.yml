name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unit and integration tests
        run: python -m pytest -q

      - name: Byte-compile
        run: python -m compileall -q src scripts tests

      - name: Ruff lint
        run: python -m ruff check src scripts tests

      # Only self-contained validations: synthetic fixtures, temp dirs, loopback SMTP sink.
      # No live market-data provider, broker, real SMTP or AI service is contacted; no secrets are used.
      - name: Paper runtime validation (synthetic fixture only)
        run: python scripts/paper_runtime_validation.py --skip-external

      - name: Alert delivery validation (loopback SMTP sink)
        run: python scripts/alert_delivery_validation.py
